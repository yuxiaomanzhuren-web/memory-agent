[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-agent"
version = "0.1.0"
description = "Four-state memory gating for conversational agents: know when you have no evidence"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = ["numpy>=1.24", "jieba==0.42.1"]

[project.optional-dependencies]
http = ["cryptography>=42"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["memory-core"]
include = ["memory_core*"]
