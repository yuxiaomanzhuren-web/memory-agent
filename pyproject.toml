[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-agent"
version = "0.4.0"
description = "Four-state memory gating for conversational agents: know when you have no evidence"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "AGPL-3.0-only"}
dependencies = ["numpy>=1.24", "jieba==0.42.1"]

[project.optional-dependencies]
# 记忆核本身只需要这两个
# 接 MCP：锁在 1.x。mcp>=2 改了 Server 的注册 API，本仓尚未适配，装了会直接报错
mcp = ["mcp>=1,<2"]
# 接 LangGraph：Store 适配器用到的只有 BaseStore 接口
langgraph = ["langgraph>=0.2,<2"]
http = ["cryptography>=42"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["memory-core"]
include = ["memory_core*"]
